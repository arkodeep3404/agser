name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build and start the platform
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8123/ok && break
            sleep 3
          done
          curl -sf http://127.0.0.1:8123/ok

      - name: Platform conformance (verify.sh, LLM-free)
        run: RUN_LLM_DEEP_AGENT=0 ./scripts/verify.sh

      - name: Config sync (graph registry parity across configs)
        run: ./scripts/check-config-sync.sh

      - name: Multi-gate HITL crash-recovery (test-workflow.sh)
        run: ./scripts/test-workflow.sh

      - name: Official-contract feature conformance (test-features.sh)
        run: ./scripts/test-features.sh

      - name: Human-in-the-loop lifecycle (test-hitl.sh, LLM-free core)
        run: RUN_LLM=0 ./scripts/test-hitl.sh

      - name: Failure injection — exactly-once recovery (test-failures.sh)
        run: ./scripts/test-failures.sh

      - name: Parity vs official public build
        run: |
          docker compose --profile official up -d --build
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8124/ok && break
            sleep 3
          done
          curl -sf http://127.0.0.1:8124/ok
          PARITY=1 BASE=http://127.0.0.1:8124 ./scripts/test-features.sh
          RUN_LLM=0 PARITY=1 RESTART_CMD="docker compose restart official" BASE=http://127.0.0.1:8124 ./scripts/test-hitl.sh

      - name: CDK synth (AWS infra is always template-valid)
        working-directory: deploy/cdk
        run: |
          npm ci
          npx tsc --noEmit
          npx cdk synth --quiet
